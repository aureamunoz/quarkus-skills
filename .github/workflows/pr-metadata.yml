name: PR Metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  collect:
    name: Collect PR metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: files
        run: |
          skills_or_tests=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- skills/ tests/ | wc -l | tr -d ' ')
          echo "changed=$( [ "$skills_or_tests" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Save PR metadata
        run: |
          mkdir -p /tmp/pr-meta
          echo "${{ github.event.pull_request.number }}" > /tmp/pr-meta/pr_number
          echo "${{ github.event.pull_request.head.sha }}" > /tmp/pr-meta/head_sha
          echo "${{ steps.files.outputs.changed }}" > /tmp/pr-meta/files_changed

      - name: Upload PR metadata
        uses: actions/upload-artifact@v7
        with:
          name: pr-meta
          path: /tmp/pr-meta/
          retention-days: 1