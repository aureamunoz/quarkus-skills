name: Execute AI SKILL using IBM Bob

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["PR Metadata"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  actions: read

env:
  JAVA_VERSION: '21'

jobs:
  run-bob:
    name: Run ACP Agent with Skill
    if: >
      github.repository_owner == 'quarkusio' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download PR metadata
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v7
        with:
          name: pr-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR metadata
        if: github.event_name == 'workflow_run'
        id: pr
        run: |
          echo "number=$(cat pr_number)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(cat head_sha)" >> "$GITHUB_OUTPUT"
          echo "files_changed=$(cat files_changed)" >> "$GITHUB_OUTPUT"

      - name: Get job URL
        id: job
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const job = data.jobs.find(j => j.name === 'Run ACP Agent with Skill');
            core.setOutput('url', job?.html_url ?? `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`);

      - name: Skip if no skills/tests changes
        if: github.event_name == 'workflow_run' && steps.pr.outputs.files_changed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr.outputs.head_sha }}',
              state: 'success',
              context: 'AI Skill Run',
              description: 'No skills/ or tests/ files changed — skipped'
            });
            core.info('No relevant files changed — skipping skill run');
            process.exit(0);

      - name: Set pending status
        if: github.event_name == 'workflow_run' && steps.pr.outputs.files_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr.outputs.head_sha }}',
              state: 'pending',
              context: 'AI Skill Run',
              description: 'Running AI skill test...',
              target_url: '${{ steps.job.outputs.url }}'
            });

      - name: Check out base branch (trusted action code)
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          path: base

      - name: Check out PR code under test
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          path: pr

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install ACP client and IBM Bob agent
        uses: ./base/.github/actions/acp-agent-action
        with:
          bobshell_version: 2.0.4
          smallrye_acp_version: 0.2.0

      - name: Execute SKILL
        shell: bash
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
          PROJECT_NAME: spring-rest-api
        run: |
          set -euo pipefail

          cd pr/tests

          echo "Run the dummy SKILL to verify that everything is working with IBM Bob, key"
          mvn clean test -Pintegration \
            -Dai.agent=ibm-bob \
            -Dai.prompt="Say Hello" \
            -Dai.projects=dummy \
            -Dai.skills=../tests/skills/dummy \
            -Dai.review=false

          echo "Migrate the project: ${PROJECT_NAME} and ask to AI to review it"
          mvn clean test -Pintegration \
            -Dai.agent=ibm-bob \
            -Dai.projects=${PROJECT_NAME} \
            -Dai.skills=migrate-spring-to-quarkus \
            -Dai.review=true

      - name: Set final status
        if: github.event_name == 'workflow_run' && always()
        uses: actions/github-script@v7
        with:
          script: |
            if ('${{ steps.pr.outputs.files_changed }}' !== 'true') return;
            const failed = '${{ job.status }}' === 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr.outputs.head_sha }}',
              state: failed ? 'failure' : 'success',
              context: 'AI Skill Run',
              description: failed ? 'AI skill test failed' : 'AI skill test passed',
              target_url: '${{ steps.job.outputs.url }}'
            });

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: run-reports-${{ github.run_id }}
          path: pr/tests/target/runs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AI workdir outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workdir-outputs-${{ github.run_id }}
          path: pr/tests/target/workdirs/
          if-no-files-found: warn
          retention-days: 30